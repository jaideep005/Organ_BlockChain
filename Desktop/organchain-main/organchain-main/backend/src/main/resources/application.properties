server.port=8080

# Pinata IPFS Credentials
# Pinata IPFS Configuration
pinata.api.key=${PINATA_API_KEY:}
pinata.api.secret=${PINATA_API_SECRET:}
pinata.jwt=${PINATA_JWT:}
web3.private-key=${WEB3_PRIVATE_KEY:}
web3.contract-address=${WEB3_CONTRACT_ADDRESS:}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/transplantdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update

web3.private-key=${BLOCKCHAIN_PRIVATE_KEY}
web3.contract-address=0x4579a2452e6ff61841c501F42f0D98237d4b6134